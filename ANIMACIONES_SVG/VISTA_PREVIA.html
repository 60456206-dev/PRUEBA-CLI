<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engranajes · V1</title><style>html,body{margin:0;background:#000;color:#ddd;font:14px system-ui}main{height:100svh;display:grid;place-items:center}object{height:100%;width:100%;position:absolute;inset:0}nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}button,a{font:inherit;background:#151515;color:#eee;border:1px solid #444;border-radius:24px;padding:10px 18px;text-decoration:none;cursor:pointer}</style><main><object id="art" data="ENGRANAJES_INTRO_V1.svg" type="image/svg+xml" aria-label="Engranajes animados"></object></main><nav><button id="pause">Pausar</button><button id="restart">Reiniciar</button><a href="ENGRANAJES_INTRO_V1.svg" download>SVG ↓</a></nav><script>const art=document.querySelector('#art'),button=document.querySelector('#pause');button.onclick=()=>{const svg=art.contentDocument.documentElement;if(svg.animationsPaused()){svg.unpauseAnimations();button.textContent='Pausar'}else{svg.pauseAnimations();button.textContent='Continuar'}};document.querySelector('#restart').onclick=()=>{art.data='ENGRANAJES_INTRO_V1.svg?t='+Date.now();button.textContent='Pausar'};</script></html>
