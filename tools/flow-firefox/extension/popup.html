<!doctype html><html lang="es"><meta charset="utf-8"><title>Conectar Flow</title>
<body style="font:15px sans-serif;width:300px;padding:12px">
<h3>Conectar esta pestaña de Flow</h3>
<p>Permite al asistente leer y manejar esta pestaña mientras esté conectada. No conectes durante el inicio de sesión.</p>
<label>Clave de conexión <input id="token" type="password" autocomplete="off"></label>
<p><button id="start">Conectar</button> <button id="stop">Detener</button></p>
<p id="status"></p><script src="popup.js"></script></body></html>
